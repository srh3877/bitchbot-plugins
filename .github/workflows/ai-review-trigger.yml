name: AI review trigger

# Deep review is an explicit, one-shot request. Add `ai-review-final` when the
# PR is ready; the hub consumes the label after publishing. Pushes do not launch
# another full review. Re-add the label once for the closure-only verification
# round after fixing blockers.
on:
  pull_request:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'ai-review-final'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch review to hub
        run: |
          # `curl -sf` reports a rejected dispatch as bare "exit code 22" with
          # no status and no body, which is how an expired AI_REVIEW_PAT looked
          # like nothing happening at all. Capture the status and print
          # GitHub's own error (it never contains the token).
          code=$(curl -s -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.AI_REVIEW_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/srh3877/code-review/dispatches \
            -d '{
              "event_type": "pr-review",
              "client_payload": {
                "repo": "${{ github.repository }}",
                "pr": ${{ github.event.pull_request.number }},
                "head_sha": "${{ github.event.pull_request.head.sha }}"
              }
            }')
          if [ "$code" = "204" ]; then
            echo "dispatched pr-review for PR #${{ github.event.pull_request.number }}"
            exit 0
          fi
          echo "::error::review dispatch rejected with HTTP $code"
          cat /tmp/dispatch-response.json || true
          case "$code" in
            401) echo "AI_REVIEW_PAT is invalid or expired — reissue it and re-run onboard-all.sh" ;;
            404) echo "AI_REVIEW_PAT cannot see srh3877/code-review — check its repository access" ;;
            403) echo "AI_REVIEW_PAT lacks Contents: write on srh3877/code-review" ;;
          esac
          exit 1
